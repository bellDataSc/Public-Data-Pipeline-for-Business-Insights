name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # ===========================================================================
  # CODE QUALITY AND SECURITY CHECKS
  # ===========================================================================
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache Dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Code Formatting Check (Black)
      run: black --check --diff src/ tests/ scripts/

    - name: Import Sorting Check (isort)
      run: isort --check-only --diff src/ tests/ scripts/

    - name: Linting (Flake8)
      run: flake8 src/ tests/ scripts/

    - name: Type Checking (MyPy)
      run: mypy src/

    - name: Security Scan (Bandit)
      run: bandit -r src/

    - name: Dependency Vulnerability Check
      run: |
        safety check
        pip-audit

    - name: Code Complexity Check
      run: |
        radon cc src/ --min B
        xenon --max-absolute B --max-modules B --max-average A src/

  # ===========================================================================
  # TESTING ACROSS MULTIPLE PYTHON VERSIONS
  # ===========================================================================
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache Dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-${{ matrix.python-version }}-pip-${{ hashFiles('requirements-dev.txt') }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Create Test Environment
      run: |
        cp .env.example .env.test
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" >> .env.test
        echo "REDIS_URL=redis://localhost:6379/0" >> .env.test
        echo "ENV=test" >> .env.test

    - name: Wait for Services
      run: |
        # Wait for PostgreSQL
        until pg_isready -h localhost -p 5432; do
          echo "Waiting for PostgreSQL..."
          sleep 1
        done
        
        # Wait for Redis
        until redis-cli -h localhost -p 6379 ping; do
          echo "Waiting for Redis..."
          sleep 1
        done

    - name: Initialize Test Database
      run: |
        PYTHONPATH=src python -c "
        from src.database.init_db import initialize_database
        initialize_database()
        "
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        ENV: test

    - name: Run Unit Tests
      run: pytest tests/unit/ -v --tb=short
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        ENV: test

    - name: Run Integration Tests
      run: pytest tests/integration/ -v --tb=short
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        ENV: test

    - name: Generate Coverage Report
      if: matrix.python-version == '3.11'
      run: |
        pytest tests/ --cov=src --cov-report=xml --cov-report=html --cov-report=term
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        ENV: test

    - name: Upload Coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Archive Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          htmlcov/
          test-results.xml
          coverage.xml

  # ===========================================================================
  # DOCKER BUILD AND SECURITY SCAN
  # ===========================================================================
  docker:
    name: Docker Build & Security
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: |
          public-data-pipeline:latest
          public-data-pipeline:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Docker Container Test
      run: |
        docker run --rm -e ENV=test public-data-pipeline:latest python -c "
        import src
        print('Application imports successfully')
        "

    - name: Docker Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: public-data-pipeline:latest
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy Results to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # ===========================================================================
  # END-TO-END TESTS
  # ===========================================================================
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [test, docker]
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Create Test Environment
      run: |
        cp .env.example .env
        echo "ENV=test" >> .env

    - name: Start Services with Docker Compose
      run: |
        docker-compose up -d postgres redis
        sleep 30

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Wait for Services to be Ready
      run: |
        timeout 60 bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'
        timeout 60 bash -c 'until redis-cli -h localhost -p 6379 ping | grep PONG; do sleep 1; done'

    - name: Run End-to-End Tests
      run: pytest tests/e2e/ -v --tb=short --timeout=300
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/public_data
        REDIS_URL: redis://localhost:6379/0
        ENV: test

    - name: Collect Service Logs
      if: always()
      run: |
        docker-compose logs > docker-compose.logs
        
    - name: Upload E2E Artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: e2e-artifacts
        path: |
          docker-compose.logs
          screenshots/
          test-results/

    - name: Stop Services
      if: always()
      run: docker-compose down -v

  # ===========================================================================
  # DOCUMENTATION BUILD AND DEPLOYMENT
  # ===========================================================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Documentation Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Build Documentation
      run: |
        mkdocs build --strict

    - name: Upload Documentation Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: site/

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        mkdocs gh-deploy --force

  # ===========================================================================
  # PERFORMANCE AND LOAD TESTING
  # ===========================================================================
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Start Services
      run: |
        docker-compose up -d postgres redis
        sleep 30

    - name: Run Performance Tests
      run: pytest tests/performance/ -v --benchmark-json=benchmark-results.json

    - name: Upload Performance Results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: benchmark-results.json

    - name: Stop Services
      if: always()
      run: docker-compose down -v

  # ===========================================================================
  # DEPLOYMENT TO STAGING
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, docker, e2e, docs]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_REGISTRY }}/public-data-pipeline:staging
          ${{ secrets.DOCKER_REGISTRY }}/public-data-pipeline:staging-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to Staging Environment
      run: |
        echo " Deploying to staging environment..."
        # Add your staging deployment commands here
        echo " Staging deployment completed"

  # ===========================================================================
  # DEPLOYMENT TO PRODUCTION
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, docker, e2e, docs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_REGISTRY }}/public-data-pipeline:latest
          ${{ secrets.DOCKER_REGISTRY }}/public-data-pipeline:v${{ github.run_number }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to Production Environment
      run: |
        echo " Deploying to production environment..."
        # Add your production deployment commands here
        echo " Production deployment completed"

    - name: Create GitHub Release
      if: success()
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
         **Production Release v${{ github.run_number }}**
          
          **Changes in this release:**
          ${{ github.event.head_commit.message }}
          
          **Deployment Information:**
          - Commit: ${{ github.sha }}
          - Author: ${{ github.actor }}
          - Workflow: ${{ github.workflow }}
          
          **Docker Image:**
          `${{ secrets.DOCKER_REGISTRY }}/public-data-pipeline:v${{ github.run_number }}`
        draft: false
        prerelease: false

  # ===========================================================================
  # NOTIFICATION AND REPORTING
  # ===========================================================================
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [quality, test, docker, e2e, docs]
    if: always()
    
    steps:
    - name: Determine Status
      id: status
      run: |
        if [[ "${{ needs.quality.result }}" == "success" && 
              "${{ needs.test.result }}" == "success" && 
              "${{ needs.docker.result }}" == "success" && 
              "${{ needs.e2e.result }}" == "success" && 
              "${{ needs.docs.result }}" == "success" ]]; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "message= All CI/CD checks passed successfully!" >> $GITHUB_OUTPUT
        else
          echo "status=failure" >> $GITHUB_OUTPUT
          echo "message= CI/CD pipeline failed. Please check the logs." >> $GITHUB_OUTPUT
        fi

    - name: Notify Slack
      if: always() && steps.status.outputs.status == 'failure'
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ steps.status.outputs.status }}
        text: ${{ steps.status.outputs.message }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

    - name: Summary Report
      if: always()
      run: |
        echo "##  CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Quality Checks**: ${{ needs.quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Tests**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Docker Build**: ${{ needs.docker.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **E2E Tests**: ${{ needs.e2e.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Documentation**: ${{ needs.docs.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Overall Status**: ${{ steps.status.outputs.message }}" >> $GITHUB_STEP_SUMMARY